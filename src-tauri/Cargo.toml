[package]
name = "vectored"
version = "0.1.0"
description = "Vectored desktop vector and pattern editor"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vectored_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication"] }
